<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patient Intake — Choose Your Language</title>
<style>
  :root{
    --paper:#efe9dd;
    --ink:#1f2420;
    --line:#c9c0ac;
    --accent:#5c6b4f;
    --accent-2:#a1462f;
    --card:#f7f3e9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:48px 24px;
    background:var(--paper);
    color:var(--ink);
    font-family:'Georgia','Iowan Old Style',serif;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- Language selection screen ---------- */
  #langScreen{ width:100%; display:flex; flex-direction:column; align-items:center; }
  .masthead{
    max-width:720px;
    text-align:center;
    margin-bottom:40px;
    border-bottom:1px solid var(--line);
    padding-bottom:28px;
  }
  h1{ font-size:2.4rem; font-weight:400; letter-spacing:0.5px; margin:0 0 10px; }
  .masthead p{ font-size:1rem; color:#565f52; margin:0; line-height:1.5; }

  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:14px;
    max-width:920px;
    width:100%;
  }
  @media (max-width:760px){ .grid{ grid-template-columns:repeat(2, 1fr); } }

  .card{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    padding:18px 10px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    transition:transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
  }
  .card:hover{ transform:translateY(-3px); box-shadow:0 6px 14px rgba(0,0,0,0.10); border-color:var(--accent); }
  .card.speaking{ border-color:var(--accent-2); background:#f3e7de; }
  .card.speaking .native{ color:var(--accent-2); }
  .card.disabled{ opacity:0.45; pointer-events:none; }

  .symbol{ font-size:2.6rem; line-height:1.1; text-align:center; font-weight:600; color:var(--ink); margin-top:4px; }
  .native{ font-size:1.15rem; line-height:1.2; text-align:center; margin-top:2px; }
  .english{ font-size:0.72rem; letter-spacing:0.4px; color:#7a7264; margin-bottom:4px; }

  .wave{
    position:absolute; top:8px; right:10px;
    display:flex; align-items:flex-end; width:14px; height:14px;
    opacity:0; transition:opacity 0.12s ease;
  }
  .card.speaking .wave{ opacity:1; }
  .wave span{ display:inline-block; width:2px; height:6px; margin-right:1px; background:var(--accent-2); animation:bounce 0.7s infinite ease-in-out; }
  .wave span:nth-child(2){ animation-delay:0.15s; }
  .wave span:nth-child(3){ animation-delay:0.3s; }
  @keyframes bounce{ 0%,100%{height:4px;} 50%{height:12px;} }

  .tap-hint{ font-size:0.68rem; color:#8a8272; margin-top:2px; }

  .status-bar{
    max-width:720px; width:100%; margin-top:28px;
    min-height:26px; text-align:center;
    font-size:0.92rem; color:var(--accent-2);
  }

  .footnote{
    max-width:720px; margin-top:20px; font-size:0.8rem; color:#7a7264;
    text-align:center; line-height:1.5;
  }
  .footnote code{ background:#e4ddca; padding:1px 5px; border-radius:2px; }

</style>
<base target="_blank">
</head>
<body>

  <!-- ============ SCREEN 1: language grid ============ -->
  <div id="langScreen">
    <div class="masthead">
      <h1>भाषाएँ — Languages of India</h1>
      <p>Tap your language. You'll hear a short welcome message in that language before the form opens </p>
    </div>

    <div class="grid" id="grid"></div>

    <div class="status-bar" id="statusBar"></div>

    
  </div>


<script>
  // TTS priority: Google Translate (unofficial) → Browser voice → Text-only
  // Google Translate codes use the base language tag (e.g. "hi" not "hi-IN").
  // googleTts → false means Google has no voice for this language.
  const languages = [
    {
      native: "हिन्दी",  english: "Hindi",
      symbol: "हिं",
      gttsCode: "hi",  speechCode: "hi-IN", googleTts: true,
      welcome: "नमस्ते! यह फ़ॉर्म भरने में हम आपकी मदद करेंगे। चलिए शुरू करते हैं।"
    },
    {
      native: "বাংলা",   english: "Bengali",
      symbol: "বং",
      gttsCode: "bn",  speechCode: "bn-IN", googleTts: true,
      welcome: "নমস্কার! এই ফর্মটি পূরণ করতে আমরা আপনাকে সাহায্য করব। চলুন শুরু করি।"
    },
    {
      native: "తెలుగు",  english: "Telugu",
      symbol: "తె",
      gttsCode: "te",  speechCode: "te-IN", googleTts: true,
      welcome: "నమస్తే! ఈ ఫారమ్ నింపడంలో మేము మీకు సహాయం చేస్తాము. ప్రారంభిద్దాం."
    },
    {
      native: "मराठी",   english: "Marathi",
      symbol: "म",
      gttsCode: "mr",  speechCode: "mr-IN", googleTts: true,
      welcome: "नमस्कार! हा फॉर्म भरण्यासाठी आम्ही तुम्हाला मदत करू. चला सुरुवात करूया."
    },
    {
      native: "தமிழ்",   english: "Tamil",
      symbol: "த",
      gttsCode: "ta",  speechCode: "ta-IN", googleTts: true,
      welcome: "வணக்கம்! இந்த படிவத்தை நிரப்ப நாங்கள் உங்களுக்கு உதவுவோம். தொடங்கலாம்."
    },
    {
      native: "ગુજરાતી", english: "Gujarati",
      symbol: "ગુ",
      gttsCode: "gu",  speechCode: "gu-IN", googleTts: true,
      welcome: "નમસ્તે! આ ફોર્મ ભરવામાં અમે તમારી મદદ કરીશું. ચાલો શરૂ કરીએ."
    },
    {
      native: "ਪੰਜਾਬੀ",  english: "Punjabi",
      symbol: "ਪੰ",
      gttsCode: "pa",  speechCode: "pa-IN", googleTts: true,
      welcome: "ਸਤ ਸ੍ਰੀ ਅਕਾਲ! ਇਹ ਫਾਰਮ ਭਰਨ ਵਿੱਚ ਅਸੀਂ ਤੁਹਾਡੀ ਮਦਦ ਕਰਾਂਗੇ। ਆਓ ਸ਼ੁਰੂ ਕਰੀਏ।"
    },
    {
      native: "ಕನ್ನಡ",   english: "Kannada",
      symbol: "ಕ",
      gttsCode: "kn",  speechCode: "kn-IN", googleTts: true,
      welcome: "ನಮಸ್ಕಾರ! ಈ ಫಾರ್ಮ್ ಭರ್ತಿ ಮಾಡಲು ನಾವು ನಿಮಗೆ ಸಹಾಯ ಮಾಡುತ್ತೇವೆ. ಪ್ರಾರಂಭಿಸೋಣ."
    },
    {
      native: "മലയാളം", english: "Malayalam",
      symbol: "മ",
      gttsCode: "ml",  speechCode: "ml-IN", googleTts: true,
      welcome: "നമസ്കാരം! ഈ ഫോം പൂരിപ്പിക്കാൻ ഞങ്ങൾ നിങ്ങളെ സഹായിക്കും. നമുക്ക് തുടങ്ങാം."
    },
    {
      native: "اردو",    english: "Urdu",
      symbol: "ع",
      gttsCode: "ur",  speechCode: "ur-IN", googleTts: true,
      welcome: "السلام علیکم! ہم اس فارم کو بھرنے میں آپ کی مدد کریں گے۔ چلیں شروع کرتے ہیں۔"
    },
    {
      native: "नेपाली",  english: "Nepali",
      symbol: "ने",
      gttsCode: "ne",  speechCode: "ne-IN", googleTts: true,
      welcome: "नमस्ते! यो फारम भर्न हामी तपाईंलाई मद्दत गर्नेछौं। सुरु गरौं।"
    },
  ];

  // ── DOM refs ──────────────────────────────────────────────────
  const grid       = document.getElementById("grid");
  const statusBar  = document.getElementById("statusBar");
  const langScreen = document.getElementById("langScreen");
  const supportsSpeech = "speechSynthesis" in window;

  // ── Browser voice fallback helpers ────────────────────────────
  let voices = [];
  function loadVoices() { voices = window.speechSynthesis.getVoices(); }
  if (supportsSpeech) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickVoice(code) {
    if (!voices.length) return null;
    const base = code.split("-")[0];
    return (
      voices.find(v => v.lang.toLowerCase() === code.toLowerCase()) ||
      voices.find(v => v.lang.toLowerCase().startsWith(base.toLowerCase())) ||
      null
    );
  }

  // ── Audio playback helper ─────────────────────────────────────
  let currentAudioEl = null;
  function playAudioUrl(url) {
    return new Promise((resolve, reject) => {
      const audio = new Audio(url);
      currentAudioEl = audio;
      audio.onended = resolve;
      audio.onerror = () => reject(new Error("audio error"));
      audio.play().catch(reject);
    });
  }

  // ── Strategy 1: Google Translate (unofficial) TTS ─────────────
  function playGoogleTts(lang) {
    if (!lang.googleTts) return Promise.reject(new Error("no Google voice"));
    const url = "https://translate.google.com/translate_tts"
      + "?ie=UTF-8&client=tw-ob"
      + "&tl=" + encodeURIComponent(lang.gttsCode)
      + "&q=" + encodeURIComponent(lang.welcome);
    return playAudioUrl(url);
  }

  // ── Strategy 2: browser's built-in speechSynthesis ────────────
  function playBrowserVoice(lang) {
    return new Promise((resolve, reject) => {
      if (!supportsSpeech) return reject(new Error("no speechSynthesis"));
      const v = pickVoice(lang.speechCode);
      if (!v) return reject(new Error("no installed voice"));
      const utter = new SpeechSynthesisUtterance(lang.welcome);
      utter.lang  = lang.speechCode;
      utter.rate  = 0.9;
      utter.voice = v;
      utter.onend  = resolve;
      utter.onerror = () => reject(new Error("speechSynthesis error"));
      window.speechSynthesis.speak(utter);
    });
  }

  // ── State ─────────────────────────────────────────────────────
  let isTransitioning = false;
  let activeCard      = null;
  let proceedCalled   = false;

  function stopAnyPlayback() {
    if (currentAudioEl) { currentAudioEl.pause(); currentAudioEl.currentTime = 0; }
    if (supportsSpeech) window.speechSynthesis.cancel();
  }

  function showForm(lang) {
    if (proceedCalled) return;
    proceedCalled = true;
    stopAnyPlayback();
    if (activeCard) activeCard.classList.remove("speaking");
    window.location.href = "patient_form.html?language=" + encodeURIComponent(lang.english);
  }

  window.addEventListener("pageshow", () => {
    isTransitioning = false;
    activeCard = null;
    proceedCalled = false;
    statusBar.textContent = "";
    document.querySelectorAll(".card").forEach(c => {
      c.classList.remove("disabled", "speaking");
    });
  });


  // Tries Google TTS → browser voice → text-only, in that order.
  async function playWelcomeThenProceed(lang) {
    const strategies = [
      () => playGoogleTts(lang),
      () => playBrowserVoice(lang),
    ];
    for (const attempt of strategies) {
      if (proceedCalled) return;
      try { await attempt(); showForm(lang); return; }
      catch (_) { /* try next */ }
    }
    // Nothing worked — show the text, pause, then open the form.
    if (proceedCalled) return;
    statusBar.textContent =
      "No voice available yet for " + lang.english
      + " — \u201c" + lang.welcome + "\u201d";
    await new Promise(r => setTimeout(r, 4500));
    showForm(lang);
  }

  // ── Build the grid ────────────────────────────────────────────
  languages.forEach(lang => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <span class="wave"><span></span><span></span><span></span></span>
      <span class="symbol" lang="${lang.speechCode}">${lang.symbol}</span>
      <span class="native" lang="lang.speechCode}">${lang.native}</span>
      <span class="english">${lang.english}</span>
      <span class="tap-hint">tap to select</span>
    `;

    card.addEventListener("click", () => {
      if (isTransitioning && activeCard === card) { showForm(lang); return; }
      if (isTransitioning) return;

      isTransitioning = true;
      proceedCalled   = false;
      activeCard      = card;
      card.classList.add("speaking");
      document.querySelectorAll(".card").forEach(c => {
        if (c !== card) c.classList.add("disabled");
      });
      statusBar.textContent =
        "\u201c" + lang.welcome + "\u201d  —  tap the card again to skip ahead";

      playWelcomeThenProceed(lang);
    });

    grid.appendChild(card);
  });
</script>

</body>
</html>
